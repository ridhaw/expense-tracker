name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Tests d'intégration (PostgreSQL via Testcontainers)
        run: dotnet test backend/ExpenseTracker.slnx --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_KEY: ci-only-signing-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Construction et démarrage de la pile complète
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fs localhost:8080/health && break; sleep 2; done
          curl -fs -X POST localhost:8080/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.dev","password":"motdepasse-ci"}'
          curl -fs localhost:3000/login > /dev/null
      - if: always()
        run: docker compose logs api
